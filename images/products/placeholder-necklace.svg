<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Mehrunisa Kundan Choker illustration">
  <defs>
    <linearGradient id="neck-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFE4D2"/>
    </linearGradient>
    <linearGradient id="brass-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C266"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8C5A3C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="14" fill="url(#neck-bg)"/>
  <!-- Silk dori ties -->
  <path d="M72 86 Q102 104 118 124" fill="none" stroke="#8C5A3C" stroke-width="4" stroke-linecap="round"/>
  <path d="M328 86 Q298 104 282 124" fill="none" stroke="#8C5A3C" stroke-width="4" stroke-linecap="round"/>
  <!-- Choker arc -->
  <path d="M114 122 C136 186, 264 186, 286 122" fill="none" stroke="url(#brass-gold)" stroke-width="26" stroke-linecap="round"/>
  <!-- Kundan stone settings -->
  <rect x="130" y="130" width="18" height="18" rx="4" transform="rotate(24 139 139)" fill="#FFFDF9" stroke="#8C5A3C" stroke-width="2"/>
  <rect x="158" y="148" width="20" height="20" rx="4" transform="rotate(12 168 158)" fill="#A8383B" stroke="#E7C266" stroke-width="2"/>
  <rect x="188" y="154" width="24" height="24" rx="5" fill="#FFFDF9" stroke="#8C5A3C" stroke-width="2.5"/>
  <rect x="222" y="148" width="20" height="20" rx="4" transform="rotate(-12 232 158)" fill="#3B6E4C" stroke="#E7C266" stroke-width="2"/>
  <rect x="252" y="130" width="18" height="18" rx="4" transform="rotate(-24 261 139)" fill="#FFFDF9" stroke="#8C5A3C" stroke-width="2"/>
  <!-- Pearl drops along lower edge -->
  <g fill="#F8F3EC" stroke="#C89B3C" stroke-width="1.2">
    <circle cx="144" cy="176" r="5"/>
    <circle cx="168" cy="188" r="5.5"/>
    <circle cx="200" cy="196" r="7"/>
    <circle cx="232" cy="188" r="5.5"/>
    <circle cx="256" cy="176" r="5"/>
  </g>
</svg>
