<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Hunza Lapis Stack Bangle illustration">
  <defs>
    <linearGradient id="hl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#E7E1D8"/>
    </linearGradient>
    <linearGradient id="hl-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C9CFD6"/>
      <stop offset="100%" stop-color="#767D87"/>
    </linearGradient>
    <linearGradient id="hl-lapis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E64B5"/>
      <stop offset="60%" stop-color="#1E3A7A"/>
      <stop offset="100%" stop-color="#11224D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="14" fill="url(#hl-bg)"/>
  <!-- Silver bangle band -->
  <ellipse cx="200" cy="154" rx="108" ry="68" fill="none" stroke="url(#hl-silver)" stroke-width="28"/>
  <ellipse cx="200" cy="154" rx="118" ry="78" fill="none" stroke="#767D87" stroke-width="1.5" stroke-dasharray="4 4"/>
  <ellipse cx="200" cy="154" rx="94" ry="54" fill="none" stroke="#767D87" stroke-width="1.4" opacity="0.65"/>
  <!-- Lapis Lazuli inlaid stations -->
  <g stroke="#E5E9EE" stroke-width="2">
    <rect x="120" y="92" width="26" height="16" rx="8" transform="rotate(-24 133 100)" fill="url(#hl-lapis)"/>
    <rect x="184" y="76" width="32" height="18" rx="9" fill="url(#hl-lapis)"/>
    <rect x="254" y="92" width="26" height="16" rx="8" transform="rotate(24 267 100)" fill="url(#hl-lapis)"/>
  </g>
  <!-- Gold pyrite flecks inside lapis -->
  <g fill="#E7C266">
    <circle cx="194" cy="83" r="1.4"/>
    <circle cx="206" cy="87" r="1.2"/>
    <circle cx="131" cy="99" r="1.2"/>
    <circle cx="268" cy="101" r="1.3"/>
  </g>
  <!-- Silver filigree beads -->
  <circle cx="160" cy="87" r="4" fill="#FFFFFF" stroke="#6E625B" stroke-width="1"/>
  <circle cx="240" cy="87" r="4" fill="#FFFFFF" stroke="#6E625B" stroke-width="1"/>
</svg>
