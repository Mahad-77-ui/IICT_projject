<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Chitrali Filigree Cuff illustration">
  <defs>
    <linearGradient id="cuff-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EDE2D0"/>
    </linearGradient>
    <linearGradient id="hammered-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB459"/>
      <stop offset="50%" stop-color="#B9823A"/>
      <stop offset="100%" stop-color="#7B4C29"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="14" fill="url(#cuff-bg)"/>
  <!-- Open hammered brass cuff -->
  <path d="M138 206 C86 184, 84 102, 146 78 C196 58, 256 64, 288 94 C318 122, 314 176, 268 204" fill="none" stroke="url(#hammered-brass)" stroke-width="32" stroke-linecap="round"/>
  <path d="M142 198 C96 178, 94 108, 152 86 C198 68, 252 74, 280 100 C306 124, 302 172, 262 196" fill="none" stroke="#F5E1B2" stroke-width="2" stroke-dasharray="6 5" opacity="0.7"/>
  <!-- Turquoise cabochon centerpiece -->
  <ellipse cx="204" cy="74" rx="22" ry="15" fill="#2E8B8B" stroke="#E7C266" stroke-width="3.5"/>
  <ellipse cx="198" cy="70" rx="6" ry="3.5" fill="#9AE2DE" opacity="0.7"/>
  <!-- Filigree side accents -->
  <circle cx="164" cy="82" r="5" fill="#E7C266" stroke="#6B4229" stroke-width="1"/>
  <circle cx="244" cy="82" r="5" fill="#E7C266" stroke="#6B4229" stroke-width="1"/>
</svg>
