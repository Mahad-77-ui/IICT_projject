<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Pearl Elegance Necklace illustration">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EDE2D0"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C36E"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8C5A3C"/>
    </linearGradient>
    <radialGradient id="pearl-grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F1E8"/>
      <stop offset="100%" stop-color="#D8C9B8"/>
    </radialGradient>
  </defs>
  <rect width="480" height="360" rx="16" fill="url(#bg-grad)"/>
  <circle cx="240" cy="180" r="132" fill="none" stroke="#C89B3C" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 6"/>
  <!-- Gold vermeil chain -->
  <path d="M126 62 C132 165, 178 242, 240 246 C302 242, 348 165, 354 62" fill="none" stroke="url(#gold-grad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 66 C144 158, 184 226, 240 230 C296 226, 336 158, 342 66" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="3 4"/>
  <!-- Side filigree beads -->
  <circle cx="154" cy="144" r="5" fill="url(#gold-grad)"/>
  <circle cx="326" cy="144" r="5" fill="url(#gold-grad)"/>
  <circle cx="174" cy="188" r="7" fill="url(#pearl-grad)" stroke="#C89B3C" stroke-width="1.2"/>
  <circle cx="306" cy="188" r="7" fill="url(#pearl-grad)" stroke="#C89B3C" stroke-width="1.2"/>
  <circle cx="204" cy="222" r="9" fill="url(#pearl-grad)" stroke="#C89B3C" stroke-width="1.2"/>
  <circle cx="276" cy="222" r="9" fill="url(#pearl-grad)" stroke="#C89B3C" stroke-width="1.2"/>
  <!-- Central pearl & gold filigree pendant -->
  <circle cx="240" cy="246" r="18" fill="none" stroke="url(#gold-grad)" stroke-width="2.5"/>
  <circle cx="240" cy="246" r="12" fill="url(#pearl-grad)" stroke="#C89B3C" stroke-width="1.5"/>
  <line x1="240" y1="264" x2="240" y2="278" stroke="url(#gold-grad)" stroke-width="2.5"/>
  <ellipse cx="240" cy="292" rx="10" ry="14" fill="url(#pearl-grad)" stroke="#C89B3C" stroke-width="1.5"/>
  <circle cx="236" cy="287" r="3" fill="#FFFFFF" opacity="0.85"/>
</svg>
