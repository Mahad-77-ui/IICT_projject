<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Shalimar Ruby Kangan illustration">
  <defs>
    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFE4D2"/>
    </linearGradient>
    <linearGradient id="sr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D47E"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8C5A3C"/>
    </linearGradient>
    <radialGradient id="sr-ruby" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#DF5468"/>
      <stop offset="55%" stop-color="#A11F33"/>
      <stop offset="100%" stop-color="#5E0F1B"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="14" fill="url(#sr-bg)"/>
  <!-- Kangan Gold Vermeil Ring -->
  <ellipse cx="200" cy="156" rx="112" ry="72" fill="none" stroke="url(#sr-gold)" stroke-width="32"/>
  <ellipse cx="200" cy="156" rx="96" ry="56" fill="none" stroke="#8C5A3C" stroke-width="1.5" opacity="0.5"/>
  <!-- Scalloped petal settings with rubies -->
  <g stroke="#F7E4B0" stroke-width="1.5">
    <ellipse cx="100" cy="126" rx="13" ry="9" transform="rotate(-48 100 126)" fill="url(#sr-ruby)"/>
    <ellipse cx="144" cy="94" rx="14" ry="10" transform="rotate(-22 144 94)" fill="url(#sr-ruby)"/>
    <ellipse cx="200" cy="84" rx="17" ry="12" fill="url(#sr-ruby)"/>
    <ellipse cx="256" cy="94" rx="14" ry="10" transform="rotate(22 256 94)" fill="url(#sr-ruby)"/>
    <ellipse cx="300" cy="126" rx="13" ry="9" transform="rotate(48 300 126)" fill="url(#sr-ruby)"/>
  </g>
  <!-- Ruby specular highlights -->
  <ellipse cx="195" cy="80" rx="5" ry="2.5" fill="#FFBAC4" opacity="0.7"/>
  <!-- Gold granules -->
  <g fill="#FFFDF7" stroke="#8C5A3C" stroke-width="1">
    <circle cx="170" cy="86" r="4"/>
    <circle cx="230" cy="86" r="4"/>
    <circle cx="120" cy="108" r="3.5"/>
    <circle cx="280" cy="108" r="3.5"/>
  </g>
</svg>
