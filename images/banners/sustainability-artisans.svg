<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <radialGradient id="bg4" cx="45%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#281408"/>
      <stop offset="100%" stop-color="#100806"/>
    </radialGradient>
    <radialGradient id="glow4" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C29963" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C29963" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="560" fill="url(#bg4)"/>
  <rect width="800" height="560" fill="url(#glow4)"/>

  <!-- Frame -->
  <rect x="14" y="14" width="772" height="532" fill="none" stroke="#C29963" stroke-width="0.8" opacity="0.4"/>

  <!-- Workshop background -->
  <!-- Floor -->
  <rect x="0" y="380" width="800" height="180" fill="#150C06" opacity="0.9"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#C29963" stroke-width="0.5" opacity="0.3"/>

  <!-- Work table -->
  <rect x="60" y="310" width="680" height="80" rx="4" fill="#2A1508" opacity="0.8"/>
  <line x1="60" y1="316" x2="740" y2="316" stroke="#C29963" stroke-width="0.5" opacity="0.3"/>

  <!-- Artisan figure (stylized silhouette) -->
  <g transform="translate(200, 100)">
    <!-- Head -->
    <circle cx="0" cy="0" r="30" fill="#3D2010" opacity="0.9"/>
    <!-- Neck -->
    <rect x="-10" y="28" width="20" height="20" fill="#3D2010" opacity="0.9"/>
    <!-- Shoulders/body -->
    <path d="M -60 50 Q -60 48 -40 46 L -15 48 L 0 48 L 15 48 L 40 46 Q 60 48 60 50 L 65 180 L -65 180 Z" fill="#2A1508" opacity="0.9"/>
    <!-- Arms -->
    <path d="M -60 55 Q -80 100 -75 160 Q -72 180 -60 185" stroke="#3D2010" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 60 55 Q 80 100 75 160 Q 72 180 60 185" stroke="#3D2010" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- Hair (traditional dupatta/headcovering suggestion) -->
    <path d="M -32,-28 Q -45,-40 -35,-55 Q -20,-72 0,-72 Q 20,-72 35,-55 Q 45,-40 32,-28 Q 10,-20 0,-18 Q -10,-20 -32,-28 Z" fill="#1A0C06" opacity="0.7"/>
    <!-- Face features (minimal) -->
    <circle cx="-10" cy="-2" r="3" fill="#C29963" opacity="0.5"/>
    <circle cx="10" cy="-2" r="3" fill="#C29963" opacity="0.5"/>
    <path d="M -8,12 Q 0,18 8,12" fill="none" stroke="#C29963" stroke-width="1" opacity="0.4"/>
    <!-- Traditional jewelry hint on neck -->
    <path d="M -15,48 Q 0,55 15,48" fill="none" stroke="#C29963" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="52" r="4" fill="#C29963" opacity="0.5"/>
  </g>

  <!-- Left artisan figure -->
  <g transform="translate(530, 120)">
    <circle cx="0" cy="0" r="28" fill="#3D2010" opacity="0.85"/>
    <rect x="-9" y="26" width="18" height="18" fill="#3D2010" opacity="0.85"/>
    <path d="M -55 48 Q -55 46 -38 44 L -13 46 L 0 46 L 13 46 L 38 44 Q 55 46 55 48 L 60 170 L -60 170 Z" fill="#291407" opacity="0.85"/>
    <path d="M -55 53 Q -72 95 -68 155" stroke="#3D2010" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 55 53 Q 72 95 68 155" stroke="#3D2010" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M -30,-26 Q -42,-38 -32,-52 Q -18,-68 0,-68 Q 18,-68 32,-52 Q 42,-38 30,-26 Q 10,-18 0,-16 Q -10,-18 -30,-26 Z" fill="#1A0C06" opacity="0.6"/>
    <!-- Glasses hint -->
    <circle cx="-9" cy="-3" r="4" fill="none" stroke="#C29963" stroke-width="1" opacity="0.4"/>
    <circle cx="9" cy="-3" r="4" fill="none" stroke="#C29963" stroke-width="1" opacity="0.4"/>
    <line x1="-5" y1="-3" x2="5" y2="-3" stroke="#C29963" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Tool in hand of first artisan -->
  <line x1="135" y1="265" x2="175" y2="315" stroke="#8B7355" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  <ellipse cx="134" cy="263" rx="6" ry="4" fill="#6B5435" opacity="0.7"/>

  <!-- Tool in hand of second artisan -->
  <line x1="600" y1="275" x2="580" y2="315" stroke="#6B5B45" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <!-- Work piece on table -->
  <g transform="translate(360, 318)">
    <!-- Jewellery frame being worked on -->
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="none" stroke="#C29963" stroke-width="3" opacity="0.7"/>
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="none" stroke="#C29963" stroke-width="1" opacity="0.4" transform="scale(0.85)"/>
    <!-- Setting stones -->
    <circle cx="-50" cy="0" r="8" fill="#C29963" opacity="0.6"/>
    <circle cx="-50" cy="0" r="5" fill="#FAF7F2" opacity="0.5"/>
    <circle cx="0" cy="0" r="10" fill="#C29963" opacity="0.7"/>
    <polygon points="0,-7 5,3 -5,3" fill="#FAF7F2" opacity="0.6"/>
    <circle cx="50" cy="0" r="8" fill="#C29963" opacity="0.6"/>
    <circle cx="50" cy="0" r="5" fill="#FAF7F2" opacity="0.5"/>
  </g>

  <!-- Magnifying glass -->
  <circle cx="650" cy="300" r="30" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.4"/>
  <circle cx="650" cy="300" r="28" fill="#2A1508" opacity="0.2"/>
  <line x1="672" y1="322" x2="690" y2="345" stroke="#8B7355" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

  <!-- Background decorative elements -->
  <g opacity="0.1">
    <circle cx="700" cy="150" r="80" fill="none" stroke="#C29963" stroke-width="1"/>
    <circle cx="700" cy="150" r="60" fill="none" stroke="#C29963" stroke-width="0.5"/>
    <circle cx="700" cy="150" r="6" fill="#C29963"/>
  </g>

  <!-- Pattern on wall -->
  <g opacity="0.08" stroke="#C29963" stroke-width="0.5">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="650" y1="0" x2="650" y2="300"/>
  </g>

  <!-- Label -->
  <text x="400" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#C29963" opacity="0.5" letter-spacing="4">ARTISAN CRAFTSMANSHIP · TRADITIONAL SKILLS</text>

  <!-- Corner ornaments -->
  <g opacity="0.4">
    <line x1="30" y1="30" x2="70" y2="30" stroke="#C29963" stroke-width="1.5"/>
    <line x1="30" y1="30" x2="30" y2="70" stroke="#C29963" stroke-width="1.5"/>
    <line x1="770" y1="30" x2="730" y2="30" stroke="#C29963" stroke-width="1.5"/>
    <line x1="770" y1="30" x2="770" y2="70" stroke="#C29963" stroke-width="1.5"/>
    <line x1="30" y1="530" x2="70" y2="530" stroke="#C29963" stroke-width="1.5"/>
    <line x1="30" y1="530" x2="30" y2="490" stroke="#C29963" stroke-width="1.5"/>
    <line x1="770" y1="530" x2="730" y2="530" stroke="#C29963" stroke-width="1.5"/>
    <line x1="770" y1="530" x2="770" y2="490" stroke="#C29963" stroke-width="1.5"/>
  </g>
</svg>
