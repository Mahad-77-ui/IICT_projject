<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg2" cx="40%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2E1A0E"/>
      <stop offset="100%" stop-color="#150A04"/>
    </radialGradient>
    <radialGradient id="glow2" cx="35%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C29963" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C29963" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>
  <rect width="800" height="600" fill="url(#glow2)"/>

  <!-- Frame -->
  <rect x="16" y="16" width="768" height="568" fill="none" stroke="#C29963" stroke-width="0.8" opacity="0.4"/>
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#C29963" stroke-width="0.3" opacity="0.2"/>

  <!-- Layered jewellery workshop scene -->
  <!-- Background bench wood texture -->
  <rect x="0" y="380" width="800" height="220" fill="#1A0C06" opacity="0.8"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#C29963" stroke-width="1" opacity="0.3"/>

  <!-- Bench grain lines -->
  <g stroke="#2A1308" stroke-width="1" opacity="0.5">
    <line x1="0" y1="410" x2="800" y2="410"/>
    <line x1="0" y1="445" x2="800" y2="445"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="515" x2="800" y2="515"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
  </g>

  <!-- Multiple rings on display -->
  <!-- Ring 1 -->
  <g transform="translate(150, 350)">
    <ellipse cx="0" cy="0" rx="45" ry="22" fill="none" stroke="#C29963" stroke-width="3" opacity="0.85"/>
    <ellipse cx="0" cy="-10" rx="14" ry="12" fill="#C29963" opacity="0.7"/>
    <ellipse cx="0" cy="-11" rx="9" ry="8" fill="#FAF7F2" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="45" ry="22" fill="none" stroke="#E8D5A0" stroke-width="1" opacity="0.3" transform="rotate(5)"/>
  </g>

  <!-- Ring 2 -->
  <g transform="translate(400, 340)">
    <ellipse cx="0" cy="0" rx="52" ry="26" fill="none" stroke="#C29963" stroke-width="3.5" opacity="0.9"/>
    <ellipse cx="0" cy="-14" rx="16" ry="14" fill="#C29963" opacity="0.7"/>
    <!-- Gem cut facets -->
    <polygon points="0,-8 8,-14 0,-20 -8,-14" fill="#FAF7F2" opacity="0.5"/>
    <polygon points="0,-8 8,-14 8,-6 0,-2" fill="#E0C88A" opacity="0.4"/>
    <polygon points="0,-8 -8,-14 -8,-6 0,-2" fill="#D4B870" opacity="0.4"/>
  </g>

  <!-- Ring 3 -->
  <g transform="translate(640, 355)">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="none" stroke="#A07840" stroke-width="2.5" opacity="0.75"/>
    <ellipse cx="0" cy="-8" rx="10" ry="10" fill="#C29963" opacity="0.5"/>
    <circle cx="0" cy="-8" r="5" fill="#FAF7F2" opacity="0.4"/>
  </g>

  <!-- Necklace draping across scene -->
  <path d="M 50 290 Q 150 310 250 300 Q 350 290 400 310 Q 450 330 550 320 Q 650 310 750 290" fill="none" stroke="#C29963" stroke-width="2" opacity="0.6" stroke-dasharray="6,4"/>
  <!-- Pendant -->
  <g transform="translate(400, 318)">
    <ellipse cx="0" cy="12" rx="16" ry="20" fill="none" stroke="#C29963" stroke-width="2" opacity="0.8"/>
    <ellipse cx="0" cy="12" rx="9" ry="13" fill="#C29963" opacity="0.4"/>
    <circle cx="0" cy="10" r="4" fill="#FAF7F2" opacity="0.5"/>
    <line x1="0" y1="-8" x2="0" y2="0" stroke="#C29963" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="-10" r="3" fill="#C29963" opacity="0.6"/>
  </g>

  <!-- Earrings pair -->
  <g transform="translate(100, 160)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#C29963" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="6" x2="0" y2="40" stroke="#C29963" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="0" cy="52" rx="10" ry="16" fill="none" stroke="#C29963" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="0" cy="52" rx="6" ry="10" fill="#C29963" opacity="0.4"/>
  </g>
  <g transform="translate(145, 165)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#C29963" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="6" x2="0" y2="40" stroke="#C29963" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="0" cy="52" rx="10" ry="16" fill="none" stroke="#C29963" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="0" cy="52" rx="6" ry="10" fill="#C29963" opacity="0.4"/>
  </g>

  <!-- Loose gemstones -->
  <g opacity="0.7">
    <polygon points="560,400 575,382 590,400 575,410" fill="#C29963" opacity="0.7"/>
    <polygon points="590,415 602,400 614,415 602,422" fill="#A07840" opacity="0.6"/>
    <polygon points="620,395 629,383 638,395 629,401" fill="#C29963" opacity="0.5"/>
    <circle cx="650" cy="405" r="8" fill="none" stroke="#C29963" stroke-width="1.5"/>
    <circle cx="650" cy="405" r="5" fill="#C29963" opacity="0.3"/>
    <polygon points="680,400 690,386 700,400 690,407" fill="#D4B870" opacity="0.6"/>
  </g>

  <!-- Fine tools -->
  <line x1="700" y1="260" x2="720" y2="420" stroke="#8B7355" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <ellipse cx="710" cy="258" rx="8" ry="5" fill="#8B7355" opacity="0.5"/>
  <line x1="740" y1="250" x2="755" y2="400" stroke="#6B5B45" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Decorative top pattern -->
  <g transform="translate(400, 100)" opacity="0.3">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#C29963" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#C29963" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="6" fill="#C29963" opacity="0.5"/>
    <line x1="-50" y1="0" x2="-38" y2="0" stroke="#C29963" stroke-width="0.5"/>
    <line x1="50" y1="0" x2="38" y2="0" stroke="#C29963" stroke-width="0.5"/>
    <line x1="0" y1="-50" x2="0" y2="-38" stroke="#C29963" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="0" y2="38" stroke="#C29963" stroke-width="0.5"/>
  </g>

  <!-- Corner ornaments -->
  <g opacity="0.5">
    <line x1="40" y1="40" x2="80" y2="40" stroke="#C29963" stroke-width="1.5"/>
    <line x1="40" y1="40" x2="40" y2="80" stroke="#C29963" stroke-width="1.5"/>
    <line x1="760" y1="40" x2="720" y2="40" stroke="#C29963" stroke-width="1.5"/>
    <line x1="760" y1="40" x2="760" y2="80" stroke="#C29963" stroke-width="1.5"/>
    <line x1="40" y1="560" x2="80" y2="560" stroke="#C29963" stroke-width="1.5"/>
    <line x1="40" y1="560" x2="40" y2="520" stroke="#C29963" stroke-width="1.5"/>
    <line x1="760" y1="560" x2="720" y2="560" stroke="#C29963" stroke-width="1.5"/>
    <line x1="760" y1="560" x2="760" y2="520" stroke="#C29963" stroke-width="1.5"/>
  </g>
</svg>
