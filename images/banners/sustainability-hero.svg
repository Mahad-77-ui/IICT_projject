<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3D2210"/>
      <stop offset="100%" stop-color="#1A0E08"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="20%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#C29963" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C29963" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#8B5A2B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5A2B" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <rect width="1200" height="680" fill="url(#glowLeft)"/>
  <rect width="1200" height="680" fill="url(#glowRight)"/>

  <!-- Subtle texture lines -->
  <g opacity="0.06" stroke="#C29963" stroke-width="0.5">
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="300" y1="0" x2="300" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="900" y1="0" x2="900" y2="680"/>
  </g>

  <!-- Fine border frame -->
  <rect x="20" y="20" width="1160" height="640" fill="none" stroke="#C29963" stroke-width="0.8" opacity="0.35"/>
  <rect x="36" y="36" width="1128" height="608" fill="none" stroke="#C29963" stroke-width="0.4" opacity="0.2"/>

  <!-- Left decorative panel -->
  <rect x="60" y="60" width="400" height="560" fill="#2A150A" opacity="0.5"/>
  <rect x="60" y="60" width="400" height="560" fill="none" stroke="#C29963" stroke-width="0.6" opacity="0.3"/>

  <!-- Jewellery crafting illustration - hands with tools (stylized) -->
  <!-- Workbench surface -->
  <rect x="80" y="440" width="360" height="8" rx="2" fill="#C29963" opacity="0.4"/>

  <!-- Ring being crafted -->
  <ellipse cx="260" cy="360" rx="55" ry="30" fill="none" stroke="#C29963" stroke-width="3" opacity="0.8"/>
  <ellipse cx="260" cy="360" rx="55" ry="30" fill="none" stroke="#C29963" stroke-width="1" opacity="0.4" transform="rotate(15,260,360)"/>
  <!-- Ring setting -->
  <ellipse cx="260" cy="345" rx="12" ry="10" fill="#C29963" opacity="0.6"/>
  <ellipse cx="260" cy="343" rx="8" ry="7" fill="#FAF7F2" opacity="0.4"/>

  <!-- Artisan hand (simplified shape) -->
  <path d="M 220 440 C 220 420 215 390 220 370 C 225 355 240 350 255 355 C 258 350 268 345 275 355 C 280 348 290 348 295 358 C 300 350 310 352 310 365 L 310 440 Z" fill="#5C3015" opacity="0.75"/>
  <!-- Fingers -->
  <path d="M 240 380 C 238 365 236 355 240 350 C 243 345 248 346 250 352 L 252 380" fill="none" stroke="#6B3D1A" stroke-width="1" opacity="0.4"/>
  <path d="M 265 380 C 264 362 263 350 267 346 C 270 342 274 344 275 350 L 276 380" fill="none" stroke="#6B3D1A" stroke-width="1" opacity="0.4"/>
  <path d="M 288 380 C 287 365 287 355 290 352 C 293 348 297 350 298 356 L 298 380" fill="none" stroke="#6B3D1A" stroke-width="1" opacity="0.4"/>

  <!-- Tool - pliers -->
  <rect x="295" y="330" width="4" height="80" rx="2" fill="#8B7355" opacity="0.7" transform="rotate(-20,297,370)"/>
  <rect x="308" y="330" width="4" height="80" rx="2" fill="#8B7355" opacity="0.7" transform="rotate(10,310,370)"/>

  <!-- Necklace chain decorative -->
  <path d="M 80 200 Q 130 180 180 200 Q 230 220 280 200 Q 330 180 380 200 Q 430 220 460 200" fill="none" stroke="#C29963" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>

  <!-- Pendant on necklace -->
  <ellipse cx="260" cy="210" rx="18" ry="22" fill="none" stroke="#C29963" stroke-width="2" opacity="0.7"/>
  <ellipse cx="260" cy="212" rx="10" ry="12" fill="#C29963" opacity="0.4"/>
  <circle cx="260" cy="210" r="4" fill="#FAF7F2" opacity="0.5"/>

  <!-- Gemstones scattered on bench -->
  <polygon points="150,420 160,400 170,420 160,428" fill="#C29963" opacity="0.6"/>
  <polygon points="195,415 203,398 211,415 203,422" fill="#A07840" opacity="0.5"/>
  <circle cx="330" cy="418" r="7" fill="none" stroke="#C29963" stroke-width="1.5" opacity="0.6"/>
  <circle cx="330" cy="418" r="4" fill="#C29963" opacity="0.3"/>

  <!-- Gold text label -->
  <text x="260" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#C29963" opacity="0.7" letter-spacing="3">HANDCRAFTED JEWELLERY</text>
  <text x="260" y="548" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#C29963" opacity="0.4" letter-spacing="2">SOUTH ASIAN HERITAGE</text>

  <!-- Right side - main content area visual hints -->
  <!-- Decorative geometric elements -->
  <g transform="translate(550, 100)">
    <!-- Large diamond ornament -->
    <rect x="210" y="130" width="120" height="120" fill="none" stroke="#C29963" stroke-width="1" opacity="0.25" transform="rotate(45,270,190)"/>
    <rect x="225" y="145" width="90" height="90" fill="none" stroke="#C29963" stroke-width="0.5" opacity="0.15" transform="rotate(45,270,190)"/>

    <!-- Floral pattern circles -->
    <circle cx="270" cy="190" r="60" fill="none" stroke="#C29963" stroke-width="0.5" opacity="0.2"/>
    <circle cx="270" cy="190" r="45" fill="none" stroke="#C29963" stroke-width="0.3" opacity="0.15"/>
    <circle cx="270" cy="190" r="8" fill="#C29963" opacity="0.3"/>

    <!-- Radiating lines -->
    <g stroke="#C29963" stroke-width="0.4" opacity="0.2">
      <line x1="270" y1="130" x2="270" y2="110"/>
      <line x1="270" y1="250" x2="270" y2="270"/>
      <line x1="210" y1="190" x2="190" y2="190"/>
      <line x1="330" y1="190" x2="350" y2="190"/>
      <line x1="227" y1="147" x2="213" y2="133"/>
      <line x1="313" y1="147" x2="327" y2="133"/>
      <line x1="227" y1="233" x2="213" y2="247"/>
      <line x1="313" y1="233" x2="327" y2="247"/>
    </g>

    <!-- Leaf motifs -->
    <ellipse cx="270" cy="155" rx="8" ry="20" fill="#C29963" opacity="0.2" transform="rotate(0,270,155)"/>
    <ellipse cx="305" cy="190" rx="20" ry="8" fill="#C29963" opacity="0.2" transform="rotate(0,305,190)"/>
    <ellipse cx="270" cy="225" rx="8" ry="20" fill="#C29963" opacity="0.2" transform="rotate(0,270,225)"/>
    <ellipse cx="235" cy="190" rx="20" ry="8" fill="#C29963" opacity="0.2" transform="rotate(0,235,190)"/>
  </g>

  <!-- Right panel text area -->
  <rect x="510" y="60" width="630" height="560" fill="#1E0F05" opacity="0.3"/>

  <!-- Main headline area hints -->
  <line x1="600" y1="250" x2="1100" y2="250" stroke="#C29963" stroke-width="0.5" opacity="0.2"/>
  <line x1="600" y1="430" x2="1100" y2="430" stroke="#C29963" stroke-width="0.5" opacity="0.2"/>

  <!-- Decorative corner details -->
  <g opacity="0.4">
    <!-- Top left -->
    <line x1="60" y1="60" x2="100" y2="60" stroke="#C29963" stroke-width="1.5"/>
    <line x1="60" y1="60" x2="60" y2="100" stroke="#C29963" stroke-width="1.5"/>
    <!-- Top right -->
    <line x1="1140" y1="60" x2="1100" y2="60" stroke="#C29963" stroke-width="1.5"/>
    <line x1="1140" y1="60" x2="1140" y2="100" stroke="#C29963" stroke-width="1.5"/>
    <!-- Bottom left -->
    <line x1="60" y1="620" x2="100" y2="620" stroke="#C29963" stroke-width="1.5"/>
    <line x1="60" y1="620" x2="60" y2="580" stroke="#C29963" stroke-width="1.5"/>
    <!-- Bottom right -->
    <line x1="1140" y1="620" x2="1100" y2="620" stroke="#C29963" stroke-width="1.5"/>
    <line x1="1140" y1="620" x2="1140" y2="580" stroke="#C29963" stroke-width="1.5"/>
  </g>

  <!-- Scattered leaf organic elements -->
  <ellipse cx="900" cy="560" rx="30" ry="12" fill="#5E3A24" opacity="0.3" transform="rotate(-30,900,560)"/>
  <ellipse cx="940" cy="540" rx="20" ry="8" fill="#5E3A24" opacity="0.25" transform="rotate(-15,940,540)"/>
  <ellipse cx="870" cy="580" rx="22" ry="9" fill="#5E3A24" opacity="0.2" transform="rotate(-45,870,580)"/>
  <ellipse cx="750" cy="590" rx="18" ry="7" fill="#5E3A24" opacity="0.2" transform="rotate(20,750,590)"/>
  <ellipse cx="1050" cy="570" rx="25" ry="10" fill="#5E3A24" opacity="0.25" transform="rotate(-10,1050,570)"/>

  <!-- Small dots pattern -->
  <g fill="#C29963" opacity="0.15">
    <circle cx="1100" cy="100" r="2"/>
    <circle cx="1120" cy="120" r="1.5"/>
    <circle cx="1090" cy="130" r="1.5"/>
    <circle cx="1110" cy="150" r="2"/>
    <circle cx="650" cy="80" r="1.5"/>
    <circle cx="670" cy="100" r="2"/>
    <circle cx="640" cy="110" r="1.5"/>
  </g>
</svg>
