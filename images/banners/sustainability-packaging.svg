<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#F3ECE0"/>
      <stop offset="100%" stop-color="#E8DDD0"/>
    </radialGradient>
    <radialGradient id="glow5" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#C29963" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C29963" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E3A24"/>
      <stop offset="100%" stop-color="#3D2010"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#bg5)"/>
  <rect width="800" height="560" fill="url(#glow5)"/>

  <!-- Frame -->
  <rect x="14" y="14" width="772" height="532" fill="none" stroke="#C29963" stroke-width="0.8" opacity="0.5"/>

  <!-- Surface - cream/natural linen texture -->
  <rect x="0" y="300" width="800" height="260" fill="#E8DDD0" opacity="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#C29963" stroke-width="0.5" opacity="0.3"/>

  <!-- Linen texture lines on surface -->
  <g stroke="#D4C9BC" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="315" x2="800" y2="315"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="345" x2="800" y2="345"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="405" x2="800" y2="405"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="435" x2="800" y2="435"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- Main jewellery box - large central piece -->
  <g transform="translate(300, 200)">
    <!-- Box base -->
    <rect x="-120" y="40" width="240" height="150" rx="3" fill="url(#boxGrad)" opacity="0.95"/>
    <!-- Box base inner lining -->
    <rect x="-110" y="50" width="220" height="130" rx="2" fill="#FAF7F2" opacity="0.1"/>
    <!-- Box lid (open) -->
    <rect x="-120" y="-80" width="240" height="125" rx="3" fill="url(#boxGrad)" opacity="0.95"/>
    <!-- Box lid exterior detail -->
    <rect x="-108" y="-70" width="216" height="104" rx="2" fill="none" stroke="#C29963" stroke-width="1" opacity="0.4"/>
    <!-- Brand monogram on lid -->
    <text x="0" y="-15" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#C29963" opacity="0.7" letter-spacing="8">Z</text>
    <line x1="-40" y1="2" x2="40" y2="2" stroke="#C29963" stroke-width="0.8" opacity="0.4"/>
    <text x="0" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#C29963" opacity="0.5" letter-spacing="4">ZAVERAT</text>
    <!-- Interior satin/velvet pad -->
    <rect x="-108" y="52" width="216" height="124" rx="2" fill="#C29963" opacity="0.15"/>
    <!-- Necklace in box -->
    <path d="M -60,100 Q -40,90 0,105 Q 40,120 60,100" fill="none" stroke="#C29963" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="107" r="12" fill="none" stroke="#C29963" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="107" r="8" fill="#C29963" opacity="0.4"/>
    <circle cx="0" cy="107" r="4" fill="#FAF7F2" opacity="0.5"/>
    <!-- Hinge detail -->
    <rect x="-10" y="37" width="20" height="8" rx="2" fill="#C29963" opacity="0.5"/>
    <!-- Gold clasp -->
    <circle cx="0" cy="40" r="4" fill="#C29963" opacity="0.6"/>
    <!-- Gold edge trim on box -->
    <rect x="-120" y="40" width="240" height="4" rx="1" fill="#C29963" opacity="0.5"/>
    <rect x="-120" y="-80" width="240" height="4" rx="1" fill="#C29963" opacity="0.5"/>
  </g>

  <!-- Small gift box left -->
  <g transform="translate(100, 260)">
    <rect x="-55" y="0" width="110" height="80" rx="2" fill="#674228" opacity="0.9"/>
    <rect x="-45" y="10" width="90" height="60" rx="2" fill="none" stroke="#C29963" stroke-width="0.8" opacity="0.3"/>
    <rect x="-55" y="-20" width="110" height="22" rx="2" fill="#5E3A24" opacity="0.9"/>
    <!-- Ribbon vertical -->
    <rect x="-6" y="-20" width="12" height="102" fill="#C29963" opacity="0.5"/>
    <!-- Ribbon horizontal -->
    <rect x="-55" y="20" width="110" height="10" fill="#C29963" opacity="0.5"/>
    <!-- Bow -->
    <ellipse cx="-15" cy="-9" rx="18" ry="8" fill="#C29963" opacity="0.6" transform="rotate(-15,-15,-9)"/>
    <ellipse cx="15" cy="-9" rx="18" ry="8" fill="#C29963" opacity="0.6" transform="rotate(15,15,-9)"/>
    <circle cx="0" cy="-9" r="6" fill="#C29963" opacity="0.7"/>
    <!-- Monogram -->
    <text x="0" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#C29963" opacity="0.6" letter-spacing="2">Z</text>
  </g>

  <!-- Small velvet pouch right -->
  <g transform="translate(680, 250)">
    <path d="M -40,80 Q -55,20 -50,-10 Q -45,-30 0,-35 Q 45,-30 50,-10 Q 55,20 40,80 Z" fill="#5E3A24" opacity="0.9"/>
    <path d="M -38,78 Q -52,22 -48,-8 Q -43,-28 0,-33 Q 43,-28 48,-8 Q 52,22 38,78 Z" fill="none" stroke="#C29963" stroke-width="0.8" opacity="0.3"/>
    <!-- Drawstring -->
    <path d="M -40,-10 Q 0,-20 40,-10" fill="none" stroke="#C29963" stroke-width="2" opacity="0.6"/>
    <!-- Tie -->
    <line x1="0" y1="-20" x2="-15" y2="-40" stroke="#C29963" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-20" x2="15" y2="-40" stroke="#C29963" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="-22" cy="-45" rx="12" ry="6" fill="none" stroke="#C29963" stroke-width="1.5" opacity="0.4" transform="rotate(-20,-22,-45)"/>
    <ellipse cx="22" cy="-45" rx="12" ry="6" fill="none" stroke="#C29963" stroke-width="1.5" opacity="0.4" transform="rotate(20,22,-45)"/>
    <!-- Monogram embroidery -->
    <text x="0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#C29963" opacity="0.3">Z</text>
  </g>

  <!-- Tissue paper/wrapping elements -->
  <path d="M 50 320 Q 150 300 250 320 Q 350 340 400 310" fill="none" stroke="#FAF7F2" stroke-width="2" opacity="0.4"/>
  <path d="M 400 310 Q 450 290 550 320 Q 620 340 700 310" fill="none" stroke="#FAF7F2" stroke-width="2" opacity="0.4"/>

  <!-- Natural dried flower/sprig decoration -->
  <g transform="translate(530, 340)" opacity="0.4">
    <line x1="0" y1="80" x2="0" y2="0" stroke="#8B6040" stroke-width="1.5"/>
    <ellipse cx="-15" cy="20" rx="20" ry="8" fill="#C29963" opacity="0.4" transform="rotate(-40,-15,20)"/>
    <ellipse cx="15" cy="35" rx="18" ry="7" fill="#A07840" opacity="0.3" transform="rotate(30,15,35)"/>
    <ellipse cx="-10" cy="50" rx="15" ry="6" fill="#C29963" opacity="0.35" transform="rotate(-20,-10,50)"/>
    <circle cx="0" cy="0" r="4" fill="#C29963" opacity="0.5"/>
    <circle cx="-2" cy="-8" r="3" fill="#C29963" opacity="0.4"/>
  </g>

  <!-- Thank you card / note card -->
  <g transform="translate(165, 365)">
    <rect x="-55" y="-25" width="110" height="75" rx="2" fill="#FAF7F2" opacity="0.9"/>
    <rect x="-49" y="-19" width="98" height="63" rx="1" fill="none" stroke="#C29963" stroke-width="0.5" opacity="0.4"/>
    <line x1="-40" y1="-5" x2="40" y2="-5" stroke="#C29963" stroke-width="0.5" opacity="0.3"/>
    <line x1="-40" y1="8" x2="40" y2="8" stroke="#C29963" stroke-width="0.5" opacity="0.3"/>
    <line x1="-40" y1="21" x2="40" y2="21" stroke="#C29963" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#5E3A24" opacity="0.6" letter-spacing="2">Thank You</text>
    <text x="0" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="5" fill="#8B6040" opacity="0.5">for choosing Zaverat</text>
  </g>

  <!-- Label -->
  <text x="400" y="525" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5E3A24" opacity="0.4" letter-spacing="4">CONSCIOUS PACKAGING · BEAUTIFULLY PRESENTED</text>

  <!-- Corner ornaments -->
  <g opacity="0.4">
    <line x1="30" y1="30" x2="70" y2="30" stroke="#C29963" stroke-width="1.5"/>
    <line x1="30" y1="30" x2="30" y2="70" stroke="#C29963" stroke-width="1.5"/>
    <line x1="770" y1="30" x2="730" y2="30" stroke="#C29963" stroke-width="1.5"/>
    <line x1="770" y1="30" x2="770" y2="70" stroke="#C29963" stroke-width="1.5"/>
    <line x1="30" y1="530" x2="70" y2="530" stroke="#C29963" stroke-width="1.5"/>
    <line x1="30" y1="530" x2="30" y2="490" stroke="#C29963" stroke-width="1.5"/>
    <line x1="770" y1="530" x2="730" y2="530" stroke="#C29963" stroke-width="1.5"/>
    <line x1="770" y1="530" x2="770" y2="490" stroke="#C29963" stroke-width="1.5"/>
  </g>
</svg>
